workflows:
  android-debug:
    name: HemaTrack Android Debug APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - flutter create .
      - flutter pub get
      - flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients:
          - mci.eyelashes@gmail.com

  android-release:
    name: HemaTrack Android Release APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - flutter create .
      - flutter pub get
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - mci.eyelashes@gmail.com

  ios-testflight:
    name: HemaTrack iOS TestFlight Build
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - flutter create .
      - flutter pub get
      - flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - mci.eyelashes@gmail.com
