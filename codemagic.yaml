workflows:
  android-debug:
    name: HemaTrack Android Debug APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - flutter create .
      - flutter pub get
      - |
        python3 - <<'PY'
        from pathlib import Path
        path = Path('android/app/build.gradle')
        text = path.read_text()
        text = text.replace(
            'sourceCompatibility = JavaVersion.VERSION_1_8\n        targetCompatibility = JavaVersion.VERSION_1_8',
            'sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n        coreLibraryDesugaringEnabled true'
        )
        if "desugar_jdk_libs" not in text:
            text += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
        path.write_text(text)
        PY
      - flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients:
          - mci.eyelashes@gmail.com

  android-release:
    name: HemaTrack Android Release APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - flutter create .
      - flutter pub get
      - |
        python3 - <<'PY'
        from pathlib import Path
        path = Path('android/app/build.gradle')
        text = path.read_text()
        text = text.replace(
            'sourceCompatibility = JavaVersion.VERSION_1_8\n        targetCompatibility = JavaVersion.VERSION_1_8',
            'sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n        coreLibraryDesugaringEnabled true'
        )
        if "desugar_jdk_libs" not in text:
            text += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
        path.write_text(text)
        PY
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - mci.eyelashes@gmail.com

  ios-testflight:
    name: HemaTrack iOS TestFlight Build
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - flutter create .
      - flutter pub get
      - flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - mci.eyelashes@gmail.com
