workflows:
  android-debug:
    name: HemaTrack Android Debug APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - flutter create .
      - flutter pub get
      - |
        python3 - <<'PY'
        from pathlib import Path

        # ── Android manifest permissions ──────────────────────────────────
        manifest = Path('android/app/src/main/AndroidManifest.xml')
        if manifest.exists():
            text = manifest.read_text()
            perms = [
                'android.permission.CAMERA',
                'android.permission.POST_NOTIFICATIONS',
                'android.permission.RECEIVE_BOOT_COMPLETED',
                'android.permission.VIBRATE',
            ]
            for p in perms:
                if p not in text:
                    text = text.replace(
                        '<application',
                        f'    <uses-permission android:name="{p}"/>\n    <application',
                    )
            if 'android.hardware.camera' not in text:
                text = text.replace(
                    '<application',
                    '    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application',
                )
            manifest.write_text(text)

        # ── build.gradle desugaring ───────────────────────────────────────
        gradle = Path('android/app/build.gradle')
        kts   = Path('android/app/build.gradle.kts')

        if gradle.exists():
            text = gradle.read_text()
            if 'coreLibraryDesugaringEnabled true' not in text:
                text = text.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
            text = text.replace('VERSION_1_8', 'VERSION_17')
            if 'desugar_jdk_libs' not in text:
                text += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
            gradle.write_text(text)

        elif kts.exists():
            text = kts.read_text()
            if 'isCoreLibraryDesugaringEnabled = true' not in text:
                text = text.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
            text = text.replace('VERSION_11', 'VERSION_17')
            if 'desugar_jdk_libs' not in text:
                if 'dependencies {' in text:
                    text = text.replace(
                        'dependencies {',
                        'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                    )
                else:
                    text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
            kts.write_text(text)
        PY
      - flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients:
          - mci.eyelashes@gmail.com

