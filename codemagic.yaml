workflows:
  android-debug:
    name: HemaTrack Android Debug APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - flutter create .
      - flutter pub get
      - |
        python3 - <<'PY'
        from pathlib import Path

        gradle = Path('android/app/build.gradle')
        kts = Path('android/app/build.gradle.kts')

        if gradle.exists():
            text = gradle.read_text()
            text = text.replace(
                'sourceCompatibility = JavaVersion.VERSION_1_8\n        targetCompatibility = JavaVersion.VERSION_1_8',
                'sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n        coreLibraryDesugaringEnabled true'
            )
            if 'desugar_jdk_libs' not in text:
                text += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
            gradle.write_text(text)

        elif kts.exists():
            text = kts.read_text()
            text = text.replace(
                'sourceCompatibility = JavaVersion.VERSION_11\n        targetCompatibility = JavaVersion.VERSION_11',
                'sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true'
            )
            if 'desugar_jdk_libs' not in text:
                text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
            kts.write_text(text)
        PY
      - flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
    publishing:
      email:
        recipients:
          - mci.eyelashes@gmail.com

