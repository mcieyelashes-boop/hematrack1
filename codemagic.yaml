  ios-testflight:
    name: HemaTrack iOS TestFlight Build
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - flutter create .
      - flutter pub get
      - |
        python3 - <<'PY'
        from pathlib import Path

        # ── iOS Info.plist usage descriptions ────────────────────────────
        plist = Path('ios/Runner/Info.plist')
        if plist.exists():
            text = plist.read_text()
            entries = {
                'NSCameraUsageDescription':
                    'Diperlukan untuk mengambil foto monitoring hemangioma.',
                'NSPhotoLibraryAddUsageDescription':
                    'Diperlukan untuk menyimpan foto monitoring ke galeri.',
                'NSPhotoLibraryUsageDescription':
                    'Diperlukan untuk mengakses foto monitoring yang tersimpan.',
            }
            for key, desc in entries.items():
                if key not in text:
                    text = text.replace(
                        '</dict>\n</plist>',
                        f'\t<key>{key}</key>\n\t<string>{desc}</string>\n</dict>\n</plist>',
                    )
            plist.write_text(text)
        PY
      - flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - mci.eyelashes@gmail.com
