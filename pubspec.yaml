name: hematrack
version: 1.0.0+1
description: Aplikasi monitoring visual hemangioma anak dengan baseline photo, ghost overlay, timeline, dan laporan PDF.
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_local_notifications: ^17.2.2
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  printing: ^5.13.2
  uuid: ^4.5.1
  intl: ^0.19.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ─── App Icon ──────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#EC407A"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  web:
    generate: false

# ─── Splash Screen ─────────────────────────────────────────
flutter_native_splash:
  color: "#FFFCFE"
  image: assets/images/splash.png
  android: true
  ios: true
  android_12:
    color: "#FFFCFE"
    image: assets/images/app_icon.png
    icon_background_color: "#FFFCFE"
    image_dark: assets/images/app_icon.png
    color_dark: "#1A0010"
    icon_background_color_dark: "#1A0010"
  fullscreen: false
